name: Destroy

# Manual (or nightly, for staging) teardown pipeline — replaces the Jenkins
# `destroy-app` and `destroy-infra` jobs for ppr/stg. Destroys the app (ECS
# service) first, then optionally the infra (VPC/ECS cluster/RDS/tunnel EC2).
#
# ⚠️ "prod" is intentionally NOT an option here — there is no destroy path
# for production, by design (mirrors Jenkins, which never had a prod
# destroy-app/destroy-infra job).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - staging
          - preprod
      destroy_infra:
        description: "Also destroy infra (VPC/ECS cluster/RDS/tunnel EC2), not just the app"
        required: true
        type: boolean
        default: false
      confirm:
        description: "I confirm I want to destroy this environment"
        required: true
        type: boolean
        default: false

  # Nightly auto-destroy of staging (app + infra) to save costs — mirrors the
  # existing Jenkins cron jobs (destroy-app @ H 0, destroy-infra @ H 1).
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: destroy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3
  DEVOPS_APP_DIR: devops/marketplace/app
  DEVOPS_INFRA_DIR: devops/marketplace/infra

jobs:
  resolve-context:
    name: Resolve context
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      confirmed: ${{ steps.resolve.outputs.confirmed }}
      destroy_infra: ${{ steps.resolve.outputs.destroy_infra }}
    steps:
      - name: Resolve environment / confirmation
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "confirmed=true" >> "$GITHUB_OUTPUT"
            echo "destroy_infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
            echo "confirmed=${{ inputs.confirm }}" >> "$GITHUB_OUTPUT"
            echo "destroy_infra=${{ inputs.destroy_infra }}" >> "$GITHUB_OUTPUT"
          fi

      # Defense in depth: "prod" is not a selectable option above, but this
      # blocks the run outright in case that ever changes by mistake.
      - name: Safety guard — never destroy prod
        if: ${{ steps.resolve.outputs.environment == 'prod' }}
        run: |
          echo "::error::Destroying 'prod' is not allowed. Aborting."
          exit 1

  destroy-app:
    name: "[App] Terraform destroy (${{ needs.resolve-context.outputs.environment }})"
    needs: resolve-context
    if: ${{ needs.resolve-context.outputs.confirmed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.resolve-context.outputs.environment }}

    steps:
      - name: Checkout devops
        uses: actions/checkout@v4
        with:
          repository: GroupeQantis/devops
          token: ${{ secrets.DEVOPS_REPO_TOKEN }}
          path: devops

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.DEVOPS_APP_DIR }}
        run: terraform init --upgrade -input=false

      - name: Terraform workspace select
        id: workspace
        working-directory: ${{ env.DEVOPS_APP_DIR }}
        run: |
          if terraform workspace select ${{ needs.resolve-context.outputs.environment }}; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Workspace '${{ needs.resolve-context.outputs.environment }}' does not exist; nothing to destroy."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform destroy
        if: ${{ steps.workspace.outputs.exists == 'true' }}
        working-directory: ${{ env.DEVOPS_APP_DIR }}
        run: |
          terraform destroy -input=false -auto-approve \
            --var-file=terraform.${{ needs.resolve-context.outputs.environment }}.tfvars \
            -var 'app_git_tag=main'

  destroy-infra:
    name: "[Infra] Terraform destroy (${{ needs.resolve-context.outputs.environment }})"
    needs: [resolve-context, destroy-app]
    if: ${{ needs.resolve-context.outputs.confirmed == 'true' && needs.resolve-context.outputs.destroy_infra == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.resolve-context.outputs.environment }}

    steps:
      - name: Checkout devops
        uses: actions/checkout@v4
        with:
          repository: GroupeQantis/devops
          token: ${{ secrets.DEVOPS_REPO_TOKEN }}
          path: devops

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.DEVOPS_INFRA_DIR }}
        run: terraform init --upgrade -input=false

      - name: Terraform workspace select
        id: workspace
        working-directory: ${{ env.DEVOPS_INFRA_DIR }}
        run: |
          if terraform workspace select ${{ needs.resolve-context.outputs.environment }}; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Workspace '${{ needs.resolve-context.outputs.environment }}' does not exist; nothing to destroy."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform destroy
        if: ${{ steps.workspace.outputs.exists == 'true' }}
        working-directory: ${{ env.DEVOPS_INFRA_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          terraform destroy -input=false -auto-approve \
            --var-file=terraform.${{ needs.resolve-context.outputs.environment }}.tfvars
