name: Deploy

# Manual deployment pipeline (replaces the Jenkins `Docker build and push`,
# `deploy-app` and `deploy-infra` jobs). One trigger, one input for the tag,
# and an optional toggle to also (re)provision infra (VPC/ECS cluster/RDS)
# before deploying the app — only needed when infra changed.
#
# Flow:
#   1. infra-plan / infra-apply     (only if deploy_infra = true)
#   2. build-and-push               (Docker images -> ECR)
#   3. app-plan / app-apply         (Terraform for the app/ECS service)
#
# Both "apply" jobs run against a GitHub Environment named after the target
# environment (staging / preprod / prod). Only "prod" has required reviewers
# configured (see repo Settings > Environments) — that's what gates
# production applies, for both infra and app.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - preprod
          - prod
      git_ref:
        description: "Branch, tag or SHA to build and deploy (app)"
        required: true
        default: main
      deploy_infra:
        description: "Also (re)provision infra (VPC/ECS cluster/RDS) before deploying the app — only needed when infra changed"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3
  DEVOPS_APP_DIR: devops/marketplace/app
  DEVOPS_INFRA_DIR: devops/marketplace/infra

jobs:
  # ────────────────────────────── Infra (optional) ──────────────────────────────
  infra-plan:
    name: "[Infra] Terraform plan (${{ inputs.environment }})"
    if: ${{ inputs.deploy_infra == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout devops
        uses: actions/checkout@v4
        with:
          repository: GroupeQantis/devops
          token: ${{ secrets.DEVOPS_REPO_TOKEN }}
          path: devops

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.DEVOPS_INFRA_DIR }}
        run: terraform init --upgrade -input=false

      - name: Terraform workspace select
        working-directory: ${{ env.DEVOPS_INFRA_DIR }}
        run: terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }}

      - name: Terraform plan
        working-directory: ${{ env.DEVOPS_INFRA_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          terraform plan -input=false -out tfplan \
            --var-file=terraform.${{ inputs.environment }}.tfvars
          terraform show -no-color tfplan > tfplan.txt

      - name: Publish plan to job summary
        working-directory: ${{ env.DEVOPS_INFRA_DIR }}
        run: |
          {
            echo "## [Infra] Terraform plan — ${{ inputs.environment }}"
            echo '```'
            cat tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-infra-${{ inputs.environment }}
          path: ${{ env.DEVOPS_INFRA_DIR }}/tfplan
          retention-days: 1

  infra-apply:
    name: "[Infra] Terraform apply (${{ inputs.environment }})"
    if: ${{ inputs.deploy_infra == true }}
    needs: infra-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Gated by the target GitHub Environment. Only "prod" has required
    # reviewers configured — staging and preprod apply immediately.
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout devops
        uses: actions/checkout@v4
        with:
          repository: GroupeQantis/devops
          token: ${{ secrets.DEVOPS_REPO_TOKEN }}
          path: devops

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.DEVOPS_INFRA_DIR }}
        run: terraform init --upgrade -input=false

      - name: Terraform workspace select
        working-directory: ${{ env.DEVOPS_INFRA_DIR }}
        run: terraform workspace select ${{ inputs.environment }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-infra-${{ inputs.environment }}
          path: ${{ env.DEVOPS_INFRA_DIR }}

      - name: Terraform apply
        working-directory: ${{ env.DEVOPS_INFRA_DIR }}
        run: terraform apply -input=false tfplan

  # ────────────────────────────── App (always) ──────────────────────────────
  build-and-push:
    name: Build & push Docker images
    needs: infra-apply
    # Runs whether infra was (re)provisioned or skipped entirely.
    if: ${{ always() && (inputs.deploy_infra != true || needs.infra-apply.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # Docker/ECR tags can't contain "/" (e.g. branch names like "feature/foo"),
      # so this normalizes `inputs.git_ref` once and is reused for both the
      # image tags below and the Terraform `app_git_tag` var, keeping them in sync.
      docker_tag: ${{ steps.tag.outputs.value }}

    steps:
      - name: Checkout marketplace
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Compute Docker tag
        id: tag
        run: echo "value=$(echo '${{ inputs.git_ref }}' | tr '/:@' '-')" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: nginx
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/marketplace-nginx:${{ steps.tag.outputs.value }}
          secrets: |
            composer_auth={"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push php image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: php
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/marketplace-php:${{ steps.tag.outputs.value }}
          secrets: |
            composer_auth={"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  app-plan:
    name: "[App] Terraform plan (${{ inputs.environment }})"
    needs: build-and-push
    # Explicit condition required: build-and-push uses always() to bypass the
    # skipped infra-apply, but that skipped ancestor still propagates through the
    # implicit success() of downstream jobs — so app-plan/app-apply must gate on
    # their direct dependency's result instead of the default success().
    if: ${{ always() && needs.build-and-push.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout devops
        uses: actions/checkout@v4
        with:
          repository: GroupeQantis/devops
          token: ${{ secrets.DEVOPS_REPO_TOKEN }}
          path: devops

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.DEVOPS_APP_DIR }}
        run: terraform init --upgrade -input=false

      - name: Terraform workspace select
        working-directory: ${{ env.DEVOPS_APP_DIR }}
        run: terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }}

      - name: Terraform plan
        working-directory: ${{ env.DEVOPS_APP_DIR }}
        run: |
          terraform plan -input=false -out tfplan \
            --var-file=terraform.${{ inputs.environment }}.tfvars \
            -var 'app_git_tag=${{ needs.build-and-push.outputs.docker_tag }}'
          terraform show -no-color tfplan > tfplan.txt

      - name: Publish plan to job summary
        working-directory: ${{ env.DEVOPS_APP_DIR }}
        run: |
          {
            echo "## [App] Terraform plan — ${{ inputs.environment }} (tag: \`${{ needs.build-and-push.outputs.docker_tag }}\`)"
            echo '```'
            cat tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-app-${{ inputs.environment }}
          path: ${{ env.DEVOPS_APP_DIR }}/tfplan
          retention-days: 1

  app-apply:
    name: "[App] Terraform apply (${{ inputs.environment }})"
    needs: app-plan
    if: ${{ always() && needs.app-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gated by the target GitHub Environment. Only "prod" has required
    # reviewers configured in repo Settings > Environments — staging and
    # preprod apply immediately once triggered.
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout devops
        uses: actions/checkout@v4
        with:
          repository: GroupeQantis/devops
          token: ${{ secrets.DEVOPS_REPO_TOKEN }}
          path: devops

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.DEVOPS_APP_DIR }}
        run: terraform init --upgrade -input=false

      - name: Terraform workspace select
        working-directory: ${{ env.DEVOPS_APP_DIR }}
        run: terraform workspace select ${{ inputs.environment }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-app-${{ inputs.environment }}
          path: ${{ env.DEVOPS_APP_DIR }}

      - name: Terraform apply
        working-directory: ${{ env.DEVOPS_APP_DIR }}
        run: terraform apply -input=false tfplan

      - name: Deployment summary
        run: |
          echo "✅ Deployed \`${{ inputs.git_ref }}\` to **${{ inputs.environment }}**${{ inputs.deploy_infra == true && ' (infra also re-provisioned)' || '' }}" >> "$GITHUB_STEP_SUMMARY"
