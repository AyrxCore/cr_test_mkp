fastcgi_index index.php;
fastcgi_buffers 16 16k;
fastcgi_buffer_size 32k;
fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
# Architecture: Client → ALB → nginx → php-fpm
# ALB sets X-Forwarded-For to the real client IP before passing to nginx.
# nginx forwards it unchanged to PHP so Symfony can read the real client IP.
# Spoofing protection: configure the AWS ALB to overwrite (not append) X-Forwarded-For.
fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
#fixes timeouts
fastcgi_read_timeout 600;
proxy_read_timeout 300;
proxy_connect_timeout 300;
proxy_send_timeout 300;
include fastcgi_params;



