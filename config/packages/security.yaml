security:
  # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
  # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
  role_hierarchy:
    ROLE_SUPER_ADMIN: [ ROLE_SUPER_ADMIN ]
    ROLE_ADMIN: ROLE_ADMIN
    ROLE_API: ROLE_API
  providers:
    users_in_memory: { memory: null }
    app_user_provider:
      entity:
        class: App\Entity\User
        property: username
    # used to reload user from session & other features (e.g. switch_user)
  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false
    app:
      pattern: ^/api
      provider: app_user_provider
      user_checker: App\Security\UserChecker
      entry_point: jwt
      jwt: ~
      json_login:
        check_path: /api/authentication/token
        success_handler: lexik_jwt_authentication.handler.authentication_success
        failure_handler: lexik_jwt_authentication.handler.authentication_failure
    main:
      lazy: true
      provider: app_user_provider
      entry_point: jwt
      jwt: ~
      login_link:
        check_route: login_check
        lifetime: 300
        signature_properties: [ 'id' ]
        success_handler: App\Security\Authentication\AutoLoginSuccessHandler
        failure_handler: App\Security\Authentication\AutoLoginFailureHandler

    # activate different ways to authenticate
    # https://symfony.com/doc/current/security.html#the-firewall

    # https://symfony.com/doc/current/security/impersonating_user.html
    # switch_user: true

  # Easy way to control access for large sections of your site
  # Note: Only the *first* access control that matches will be used
  access_control:
    - { path: ^/login/neo-auto-login, roles: ROLE_API }
    - { path: ^/api/authentication/token, roles: PUBLIC_ACCESS }
    - { path: ^/api/user/logout, roles: PUBLIC_ACCESS }
    - { path: ^/api/docs, roles: PUBLIC_ACCESS }
    - { path: ^/api/contact, roles: PUBLIC_ACCESS }
    - { path: ^/api/cms, roles: PUBLIC_ACCESS }
    - { path: ^/api/legal-content, roles: PUBLIC_ACCESS }
    - { path: ^/api/channels/by-host/, roles: PUBLIC_ACCESS }
    - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/app, roles: PUBLIC_ACCESS }
    - { path: ^/, roles: PUBLIC_ACCESS }
